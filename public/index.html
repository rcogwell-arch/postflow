<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PostFlow - AI Social Media Scheduler</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f9f9f9; color: #111; }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; background: #fff; border-bottom: 1px solid #eee; }
    .logo { font-size: 18px; font-weight: 600; } .logo span { color: #1D9E75; }
    .container { max-width: 560px; margin: 48px auto; padding: 0 24px; }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    p { color: #666; font-size: 15px; margin-bottom: 24px; }
    .plans { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 24px; }
    .plan { border: 1px solid #ddd; border-radius: 12px; padding: 16px; cursor: pointer; transition: border 0.15s; }
    .plan:hover, .plan.active { border: 2px solid #1D9E75; }
    .plan-name { font-weight: 600; margin-bottom: 4px; }
    .plan-price { font-size: 22px; font-weight: 700; }
    .plan-price span { font-size: 13px; font-weight: 400; color: #888; }
    .btn { background: #1D9E75; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; width: 100%; }
    .btn:hover { background: #0F6E56; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="nav"><span class="logo">Post<span>Flow</span></span></div>
  <div class="container">
    <h1>Get started with PostFlow</h1>
    <p>AI-powered social media scheduling. Pick a plan to begin.</p>
    <input type="email" id="email" placeholder="Your email address">
    <div class="plans">
      <div class="plan" onclick="pick('free',this)">
        <div class="plan-name">Free</div>
        <div class="plan-price">$0<span>/mo</span></div>
      </div>
      <div class="plan active" id="pro-plan" onclick="pick('pro',this)">
        <div class="plan-name">Pro</div>
        <div class="plan-price">$19<span>/mo</span></div>
      </div>
      <div class="plan" onclick="pick('agency',this)">
        <div class="plan-name">Agency</div>
        <div class="plan-price">$49<span>/mo</span></div>
      </div>
    </div>
    <button class="btn" onclick="checkout()">Get started</button>
  </div>
  <script>
    const PRICES = {
      pro: 'REPLACE_PRO_PRICE_ID',
      agency: 'REPLACE_AGENCY_PRICE_ID'
    };
    let selected = 'pro';
    function pick(plan, el) {
      selected = plan;
      document.querySelectorAll('.plan').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
    }
    async function checkout() {
      const email = document.getElementById('email').value;
      if (!email) { alert('Please enter your email'); return; }
      if (selected === 'free') { alert('Free plan activated!'); return; }
      const res = await fetch('/api/create-checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ priceId: PRICES[selected], email })
      });
      const { url } = await res.json();
      window.location.href = url;
    }
  </script>
</body>
</html>

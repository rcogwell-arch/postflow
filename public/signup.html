<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PostFlow — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--text:#f0f0f8;--muted:#6b6b8a;--accent:#7c6af5}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 30% 30%,rgba(124,106,245,0.1) 0%,transparent 60%);pointer-events:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:48px 40px;width:100%;max-width:420px;position:relative;z-index:1}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;text-align:center;margin-bottom:32px}
.logo span{color:var(--accent)}
h2{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:32px}
.field{margin-bottom:16px}
label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
input:focus{border-color:var(--accent)}
input::placeholder{color:var(--muted)}
.btn{width:100%;padding:15px;border-radius:12px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;transition:all 0.25s;margin-top:8px}
.btn:hover{background:#6a58e3}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.signin-link{text-align:center;font-size:14px;color:var(--muted)}
.signin-link a{color:var(--accent);text-decoration:none}
.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
.success{background:rgba(124,106,245,0.1);border:1px solid rgba(124,106,245,0.3);color:#a78bfa;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Post<span>Flow</span></div>
  <h2>Create your account</h2>
  <p class="sub">Start scheduling smarter today</p>
  <div class="error" id="err"></div>
  <div class="success" id="suc"></div>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com"/>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min. 8 characters"/>
  </div>
  <button class="btn" onclick="signup()" id="btn">Create Account</button>
  <div class="divider">or</div>
  <p class="signin-link">Already have an account? <a href="/login.html">Sign in</a></p>
</div>
<script>
const urlParams=new URLSearchParams(window.location.search);
const plan=urlParams.get('plan')||'free';
async function signup(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('btn');
  const err=document.getElementById('err');
  const suc=document.getElementById('suc');
  err.style.display='none';suc.style.display='none';
  if(!email||!password){showErr('Please fill in all fields.');return;}
  if(password.length<8){showErr('Password must be at least 8 characters.');return;}
  btn.disabled=true;btn.textContent='Creating account…';
  try {
    const res=await fetch('/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,plan})});
    const data=await res.json();
    if(data.error){showErr(data.error);btn.disabled=false;btn.textContent='Create Account';}
    else{suc.style.display='block';suc.textContent='✓ Account created! Check your email to confirm, then sign in.';btn.textContent='Account Created!';setTimeout(()=>{window.location.href='/login.html';},2000);}
  } catch(e){showErr('Something went wrong. Please try again.');btn.disabled=false;btn.textContent='Create Account';}
}
function showErr(msg){const el=document.getElementById('err');el.textContent=msg;el.style.display='block';}
document.getElementById('password').addEventListener('keypress',e=>{if(e.key==='Enter')signup();});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PostFlow — Payment Successful!</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--surface:#13131a;--border:#1e1e2e;--text:#f0f0f8;--muted:#6b6b8a;--accent:#7c6af5}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 40%,rgba(124,106,245,0.12) 0%,transparent 60%);pointer-events:none}
.card{text-align:center;max-width:440px;position:relative;z-index:1}
.icon{font-size:72px;margin-bottom:24px;animation:pop 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
h1{font-family:'Syne',sans-serif;font-size:40px;font-weight:800;letter-spacing:-2px;margin-bottom:12px}
h1 span{color:var(--accent)}
p{color:var(--muted);font-size:16px;line-height:1.6;margin-bottom:32px}
.btn{display:inline-block;padding:16px 40px;border-radius:12px;background:var(--accent);color:#fff;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;text-decoration:none;transition:all 0.25s}
.btn:hover{background:#6a58e3;transform:scale(1.02)}
.countdown{color:var(--muted);font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎉</div>
  <h1>You're all set, <span>let's go!</span></h1>
  <p>Your payment was successful. Welcome to PostFlow — your account is now active and ready to use.</p>
  <a href="/login.html" class="btn">Go to PostFlow →</a>
  <p class="countdown" id="cd">Redirecting in 5 seconds…</p>
</div>
<script>
let n=5;
const cd=document.getElementById('cd');
setInterval(()=>{n--;cd.textContent=`Redirecting in ${n} seconds…`;if(n<=0)window.location.href='/login.html';},1000);
</script>
</body>
</html>
